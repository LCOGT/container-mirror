name: Mirror image
run-name: Mirror image ${{ inputs.from }} -> ${{ inputs.to }}

on:
  workflow_dispatch:
    inputs:
      from:
        type: string
        description: Image to mirror (e.g. docker.io/postgres:15.18-bookworm)
        required: true
      
      to:
        type: string
        description: Name and tag of the mirrored image in this repo. This can include namespace components too. (e.g. namespace/nested/postgres:15.18-bookwork)
        required: true

jobs:
  mirror:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Mirror
        env:
          fromImage: ${{ inputs.from }}
          toImage: ${{ inputs.to }}
        run: |-
          docker buildx imagetools create --tag "ghcr.io/${GITHUB_REPOSITORY,,}/$toImage" "$fromImage"
