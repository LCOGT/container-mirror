name: Mirror image

on:
  workflow_dispatch:
    inputs:
      from:
        type: string
        description: Image to mirror (e.g. ghcr.io/kptdev/krm-functions-catalog/starlark:v0.5.0)
        required: true
      
      to:
        type: string
        description: Name and tag of the mirrored image in this repo (e.g. kptdev/krm-functions-catalog/starlark:v0.5.0)
        required: true

jobs:
  mirror:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Mirror
        env:
          fromImage: ${{ inputs.from }}
          toImage: ${{ inputs.to }}
        run: |-
          docker buildx imagetools create --tag "ghcr.io/$GITHUB_REPOSITORY/$toImage" "$fromImage"
